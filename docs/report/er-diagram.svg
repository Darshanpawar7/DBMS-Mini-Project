<text x="776" y="790" font-size="11.5" fill="#64748b">Rectangle: entity (PK underlined) · double rectangle: weak entity</text>
<text x="776" y="811" font-size="11.5" fill="#64748b">Dashed underline: partial key (chunk_index, unique per document)</text>
<text x="776" y="832" font-size="11.5" fill="#64748b">Diamond: relationship · double diamond: identifying relationship</text>
<text x="776" y="853" font-size="11.5" fill="#64748b">Dashed oval: attribute of a relationship (M:N junction column)</text>
<text x="776" y="874" font-size="11.5" fill="#64748b">Double line: total participation (every row must take part)</text>
<text x="776" y="895" font-size="11.5" fill="#64748b">1 / N / M: cardinality · FKs appear only after mapping (see §3)</text>
